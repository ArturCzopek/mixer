name: Backtest data

# Manual run: exports the popflash club history and the players' FACEIT match stats for the balancing
# backtest (T-1 / T-2) and commits them back to main as TEST FIXTURES (D25). The cloud sandbox cannot
# reach popflash.site or open.faceit.com.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "probe | popflash | faceit | results | probe-elo"
        required: true
        default: probe

permissions:
  contents: write

concurrency:
  group: backtest-data
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export
        env:
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          # probe-elo only: field names to the log, nothing written
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
        run: node scripts/backtest-data.mjs "${{ inputs.step }}"
      - name: Commit fixtures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/balance/__fixtures__
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Backtest data: ${{ inputs.step }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
